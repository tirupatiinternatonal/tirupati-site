name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize deploy inputs
        shell: bash
        env:
          RAW_CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          RAW_CPANEL_USER: ${{ secrets.CPANEL_USER }}
          RAW_CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          RAW_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          {
            echo "CPANEL_HOST=$(trim "$RAW_CPANEL_HOST")"
            echo "CPANEL_USER=$(trim "$RAW_CPANEL_USER")"
            echo "CPANEL_PORT=$(trim "$RAW_CPANEL_PORT")"
            echo "DEPLOY_PATH=$(trim "$RAW_DEPLOY_PATH")"
          } >> "$GITHUB_ENV"

      - name: Deploy files to cPanel
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ env.CPANEL_HOST }}
          REMOTE_USER: ${{ env.CPANEL_USER }}
          REMOTE_PORT: ${{ env.CPANEL_PORT }}
          SOURCE: "./public_html/"
          TARGET: ${{ env.DEPLOY_PATH }}
          EXCLUDE: "/.git/,/.github/,/.env,/admin/.env,/public/uploads/,/public/resume/,/storage/,/node_modules/"
