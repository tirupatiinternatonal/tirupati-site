name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy files to cPanel
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT }}
          SOURCE: "./public_html/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: "/.git/,/.github/,/.env,/admin/.env,/public/uploads/,/public/resume/,/storage/,/node_modules/"
