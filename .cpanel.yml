deployment:
  tasks:
    - export DEPLOYPATH=/home/tiruinter/public_html
    - /usr/bin/rsync -av --delete --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='admin/.env' --exclude='public/uploads/' --exclude='public/resume/' --exclude='storage/' --exclude='node_modules/' public_html/ "$DEPLOYPATH/"
    - if [ -f "$DEPLOYPATH/artisan" ]; then /usr/local/bin/php "$DEPLOYPATH/artisan" optimize:clear || /usr/bin/php "$DEPLOYPATH/artisan" optimize:clear || php "$DEPLOYPATH/artisan" optimize:clear; fi